[project]
name = "ctrl-prj"
version = "0.1.0"
description = "Catalogar, identificar e manter descrição atualizada de projetos e códigos no filesystem."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.2",
]

[project.scripts]
ctrl_prj = "ctrl_prj.cli:main"
ctrl-prj = "ctrl_prj.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

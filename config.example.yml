# ==============================================================================
# ctrl_prj - Exemplo de Arquivo de Configuração (config.example.yml)
# ==============================================================================

# Configurações do Scanner e Descoberta de Projetos
scan:
  # Lista de diretórios raízes a serem inspecionados (contêm múltiplos projetos dentro)
  roots:
    - ~/projetos
    - ~/scripts

  # Pastas ou scripts de projetos individuais diretos (cada item é tratado como um projeto único)
  individual_projects:
    - ~/meu_projeto_avulso
    - ~/scripts/meu_script.py


  # Diretórios, pastas e arquivos que o scanner deve ignorar por padrão
  exclusions:
    # Git, Ambientes e Caches de Build
    - .git
    - node_modules
    - .venv
    - venv
    - __pycache__
    - target
    - dist
    - build
    - coverage
    - .cache

    # Ferramentas de IA e IDEs
    - .claude
    - .cursor
    - .gemini
    - graphify-out

    # Caches de Testes e Linters
    - .pytest_cache
    - .mypy_cache
    - .ruff_cache

    # Segredos e Variáveis de Ambiente
    - .env
    - .env.*

    # Arquivos de Lock de Dependências (pesados e desnecessários para entender o projeto)
    - package-lock.json
    - pnpm-lock.yaml
    - yarn.lock
    - uv.lock
    - poetry.lock
    - Cargo.lock

    # Marcadores de pacote Python (para manter relatórios limpos)
    - __init__.py

  # Extensões de arquivos de código reconhecidas para análise estrutural
  code_extensions:
    - .py
    - .rs
    - .sh
    - .bash
    - .js
    - .mjs
    - .cjs
    - .ts
    - .tsx

  # Arquivos de contexto e metadados que auxiliam na identificação do projeto
  context_files:
    - README.md
    - pyproject.toml
    - requirements.txt
    - Cargo.toml
    - package.json
    - tsconfig.json
    - Dockerfile
    - "*.yaml"
    - "*.yml"
    - "*.json"
    - "*.toml"
    - "*.sql"
    - Makefile

  # Define se o scanner deve seguir links simbólicos (padrão: false)
  follow_symlinks: false

# Configurações do Banco de Dados SQLite (Persistência)
database:
  # Caminho do arquivo SQLite onde o estado e análises serão salvos
  path: ~/.ctrl_prj/data.db

# Configurações de Fingerprint e Hashing
fingerprint:
  # Algoritmo de hash utilizado para arquivos e entidades (padrão: sha256)
  algorithm: sha256

# Configurações do Provedor de LLM
llm:
  # Provedor desejado: openai, anthropic, openrouter, ollama, lmstudio
  provider: openai

  # Identificador do modelo a ser utilizado
  model: gpt-4o-mini

  # Nome da variável de ambiente que contém a chave da API (NÃO COLOQUE A CHAVE DIRETAMENTE AQUI)
  api_key_env: OPENAI_API_KEY

  # Temperatura do modelo (0.0 a 2.0 - menor valor = mais determinístico)
  temperature: 0.0

  # Limite máximo de tokens de resposta
  max_tokens: 2000

  # URL base (obrigatória/útil para provedores locais como Ollama, LM Studio ou endpoints personalizados)
  # base_url: http://localhost:11434/v1

# Configurações de Geração de Relatórios
reporter:
  # Diretório onde os relatórios Markdown (INDEX.md e relatórios de projetos) serão gerados
  output_dir: reports
  # Identificador deste computador/dispositivo (usado como prefixo nos arquivos de relatórios)
  device: meu-computador

